<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabVision AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup-shell">
    <header class="brand-row">
      <div class="brand-mark" aria-hidden="true"><span></span></div>
      <div>
        <p class="eyebrow">TABVISION</p>
        <h1>AI Assistant</h1>
      </div>
      <button id="settingsButton" class="icon-button" title="Open settings" aria-label="Open settings">⚙</button>
    </header>

    <section id="statusCard" class="status-card" data-state="IDLE">
      <div class="status-line">
        <span id="statusDot" class="status-dot"></span>
        <span id="statusLabel">Ready</span>
      </div>
      <p id="statusDetail">Press Ctrl+Shift+A or use the button below.</p>
      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
    </section>

    <button id="captureButton" class="primary-button">
      <span class="button-symbol">◉</span>
      <span id="captureButtonLabel">CAPTURE &amp; ANALYZE</span>
    </button>

    <section class="result-card" aria-live="polite">
      <div class="result-heading">
        <span>Latest result</span>
        <span id="confidenceBadge" class="confidence-badge">—</span>
      </div>
      <p id="questionText" class="question-text">No analysis yet.</p>
      <div id="answerText" class="answer-box">Your answer will appear here.</div>
    </section>

    <footer class="popup-footer">
      <span class="hotkey"><kbd>Ctrl</kbd><span>+</span><kbd>Shift</kbd><span>+</span><kbd>A</kbd></span>
      <span>Capture shortcut</span>
    </footer>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
