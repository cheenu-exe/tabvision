<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TabVision Demo Field</title>
  <style>
    :root { font-family: Inter, system-ui, sans-serif; color: #17213a; background: #edf3ff; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; }
    main { width: min(680px, 100%); padding: 34px; background: white; border: 1px solid #dce6ff; border-radius: 22px; box-shadow: 0 20px 60px rgba(54, 78, 133, .15); }
    .label { color: #5376d9; font-size: 12px; font-weight: 800; letter-spacing: .15em; }
    h1 { margin: 8px 0; font-size: clamp(28px, 5vw, 44px); }
    p { color: #64708a; line-height: 1.7; }
    label { display: block; margin-top: 26px; margin-bottom: 8px; font-weight: 750; }
    input { width: 100%; padding: 15px; box-sizing: border-box; font: inherit; border: 2px solid #bfd0ff; border-radius: 12px; outline: none; }
    input:focus { border-color: #6687e6; box-shadow: 0 0 0 4px #eef2ff; }
    .hint { margin-top: 13px; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <div class="label">TABVISION / LOCAL DEMO</div>
    <h1>Focused answer field</h1>
    <p>Keep this field focused, open the TabVision popup, and choose Capture &amp; Analyze. Demo mode will return the configured sample answer and type it here.</p>
    <label for="answer">Answer</label>
    <input id="answer" type="text" autofocus placeholder="The answer will be typed here">
    <p class="hint">Tip: use Alt + Shift + X to stop while typing.</p>
  </main>
</body>
</html>
